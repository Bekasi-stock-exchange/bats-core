  /api/participant/assets:
    get:
      description: |-
        Every instrument the authenticated broker holds, with the current market
        value of each.

        The broker is taken from the API key and this endpoint accepts no
        `participant` parameter, so one broker cannot read another's positions.

        value is derived from the latest trade price rather than stored, so it is
        current even when this broker has not traded. It is null when the
        instrument has never traded.
      operationId: myAssets
      parameters:
      - description: Page number, from 1
        in: query
        name: page
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: Items per page, max 100
        in: query
        name: limit
        schema:
          default: 10
          maximum: 100
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.Page-assets_HoldingView'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-Participant-Key
      security:
      - ParticipantKeyAuth: []
      summary: Own share holdings
      tags:
      - participant
  /api/participant/emiten/{kode}:
    get:
      description: |-
        Master data plus all-time price statistics and derived valuations.

        current_price, highest_price, lowest_price and value are **null**, not 0,
        for an instrument that has never traded — no price exists yet, which is
        not the same as a price of zero.

        value is market capitalisation (current price × total shares), derived on
        read rather than stored, so it always reflects the latest trade.
        free_float_percentage is the publicly tradeable share of the total and
        always sums to 100 with unlisted_percentage.
      operationId: getEmitenDetail
      parameters:
      - description: Emiten code
        example: BBCA
        in: path
        name: kode
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/emiten.EmitenDetail'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-Participant-Key
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unknown emiten
      security:
      - ParticipantKeyAuth: []
      summary: Get instrument detail
      tags:
      - participant
  /api/participant/emiten/{kode}/candles:
    get:
      description: |-
        Executions aggregated into open/high/low/close bars with volume, newest
        bar first. Buckets are UTC-aligned. Open and close follow execution
        order, so two trades sharing a timestamp still resolve correctly.
      operationId: emitenCandles
      parameters:
      - description: Emiten code
        example: BBCA
        in: path
        name: kode
        required: true
        schema:
          type: string
      - description: Bucket width
        in: query
        name: interval
        schema:
          default: 1h
          enum:
          - 1m
          - 5m
          - 1h
          - 1d
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/trade.CandleView'
                type: array
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unsupported interval
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-Participant-Key
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unknown emiten
      security:
      - ParticipantKeyAuth: []
      summary: Price history (OHLC candles)
      tags:
      - participant
  /api/participant/emiten/{kode}/prices:
    get:
      description: |-
        Every execution for an instrument, newest first. Build candles from this
        client-side, or use the candles endpoint.
      operationId: emitenTicks
      parameters:
      - description: Emiten code
        example: BBCA
        in: path
        name: kode
        required: true
        schema:
          type: string
      - description: Page number, from 1
        in: query
        name: page
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: Items per page, max 100
        in: query
        name: limit
        schema:
          default: 10
          maximum: 100
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.Page-trade_TickView'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-Participant-Key
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unknown emiten
      security:
      - ParticipantKeyAuth: []
      summary: Price history (raw executions)
      tags:
      - participant
  /api/participant/orderbook:
    get:
      description: Returns a paginated list of the current order books, ordered by
        emiten code.
      operationId: getOrderBooks
      parameters:
      - description: Page number, from 1
        in: query
        name: page
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: Items per page, max 100
        in: query
        name: limit
        schema:
          default: 10
          maximum: 100
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.Page-orderbook_BookSnapshot'
          description: A page of order books
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-Participant-Key
      security:
      - ParticipantKeyAuth: []
      summary: List order books
      tags:
      - participant
  /api/participant/orderbook/{kode}:
    get:
      description: |-
        Returns the book aggregated by price level. Bids are highest price
        first; asks are lowest price first.
      operationId: getOrderBook
      parameters:
      - description: Emiten code
        example: BBCA
        in: path
        name: kode
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/orderbook.BookSnapshot'
          description: Current book state
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-Participant-Key
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unknown emiten
      security:
      - ParticipantKeyAuth: []
      summary: Get one order book
      tags:
      - participant
  /api/participant/orders:
    post:
      description: |-
        Runs the order through continuous matching and returns the trades it
        produced. A limit order with leftover quantity rests in the book (open);
        a market order with leftover quantity is cancelled and never booked.
        The order, its trades and the fills against the resting orders it
        consumed are persisted in a single transaction.

        A sell is rejected if the broker does not hold enough shares once its
        resting sell orders are counted, so a position can never go negative.
      operationId: submitOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/order.SubmitOrderRequest'
              description: Order to submit
              summary: body
        description: Order to submit
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/order.SubmitOrderResponse'
          description: 'Order processed: the resulting order state and any trades'
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unknown emiten/participant, bad side/type, qty <= 0, price
            <= 0 for a limit order, insufficient shares, or an inactive emiten
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-Participant-Key
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Persistence failure
      security:
      - ParticipantKeyAuth: []
      summary: Submit a new order
      tags:
      - participant
  /api/participant/transactions:
    get:
      description: |-
        Every fill for the authenticated broker, newest first, seen from its own
        side — so `side` and `counterparty` are relative to the caller.

        The broker is taken from the API key. This endpoint accepts no
        `participant` parameter, so one broker cannot read another's fills.
      operationId: myTransactions
      parameters:
      - description: Filter by emiten code
        example: BBCA
        in: query
        name: emiten
        schema:
          type: string
      - description: Page number, from 1
        in: query
        name: page
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: Items per page, max 100
        in: query
        name: limit
        schema:
          default: 10
          maximum: 100
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.Page-trade_TransactionView'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-Participant-Key
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unknown emiten filter
      security:
      - ParticipantKeyAuth: []
      summary: Own transaction history
      tags:
      - participant
  /api/participant/wallet:
    get:
      description: |-
        The authenticated broker's current cash balance.

        The broker is taken from the API key and this endpoint accepts no
        `participant` parameter, so one broker cannot read another's balance.
      operationId: myWallet
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wallet.WalletView'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-Participant-Key
      security:
      - ParticipantKeyAuth: []
      summary: Own cash balance
      tags:
      - participant
  /ws/admin/orderbook/{kode}:
    get:
      description: |-
        Upgrades to a WebSocket connection. On connect the server sends a full
        snapshot — the same shape as GET /api/participant/orderbook/{kode}, tagged
        with type "update" — then a fresh full snapshot every time this emiten's
        book changes. The stream is outbound-only; orders are never accepted over it.

        The identical stream is available to admin at /ws/admin/orderbook/{kode};
        only the credential differs.

        Not exercisable from Swagger UI, because it is not plain HTTP and browsers
        cannot set headers on a WS handshake. Connect with a WebSocket client at
        ws://localhost:8080/ws/participant/orderbook/BBCA.
        The same outbound-only book stream as the participant route, reached with
        the static admin key instead of a broker key. One controller serves both,
        so the payload is identical.
      operationId: streamOrderBookAdmin
      parameters:
      - description: Emiten code
        example: BBCA
        in: path
        name: kode
        required: true
        schema:
          type: string
      - description: Emiten code
        example: BBCA
        in: path
        name: kode
        required: true
        schema:
          type: string
      responses:
        "101":
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/orderbook.BookSnapshot'
                - $ref: '#/components/schemas/orderbook.BookSnapshot'
          description: Switching Protocols; thereafter each message is a book snapshot
        "401":
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/httpx.ErrorResponse'
                - $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-API-Key
        "404":
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/httpx.ErrorResponse'
                - $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unknown emiten
      security:
      - ParticipantKeyAuth: []
      - ApiKeyAuth: []
      summary: Stream order book updates (WebSocket, admin)
      tags:
      - participant
      - admin
  /ws/participant/orderbook/{kode}:
    get:
      description: |-
        Upgrades to a WebSocket connection. On connect the server sends a full
        snapshot — the same shape as GET /api/participant/orderbook/{kode}, tagged
        with type "update" — then a fresh full snapshot every time this emiten's
        book changes. The stream is outbound-only; orders are never accepted over it.

        The identical stream is available to admin at /ws/admin/orderbook/{kode};
        only the credential differs.

        Not exercisable from Swagger UI, because it is not plain HTTP and browsers
        cannot set headers on a WS handshake. Connect with a WebSocket client at
        ws://localhost:8080/ws/participant/orderbook/BBCA.
        The same outbound-only book stream as the participant route, reached with
        the static admin key instead of a broker key. One controller serves both,
        so the payload is identical.
      operationId: streamOrderBookAdmin
      parameters:
      - description: Emiten code
        example: BBCA
        in: path
        name: kode
        required: true
        schema:
          type: string
      - description: Emiten code
        example: BBCA
        in: path
        name: kode
        required: true
        schema:
          type: string
      responses:
        "101":
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/orderbook.BookSnapshot'
                - $ref: '#/components/schemas/orderbook.BookSnapshot'
          description: Switching Protocols; thereafter each message is a book snapshot
        "401":
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/httpx.ErrorResponse'
                - $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-API-Key
        "404":
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/httpx.ErrorResponse'
                - $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unknown emiten
      security:
      - ParticipantKeyAuth: []
      - ApiKeyAuth: []
      summary: Stream order book updates (WebSocket, admin)
      tags:
      - participant
      - admin
