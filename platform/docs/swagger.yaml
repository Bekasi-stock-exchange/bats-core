components:
  schemas:
    assets.HoldingView:
      properties:
        amount_shared:
          description: Shares held.
          example: 1000000
          format: int64
          type: integer
        emiten:
          example: BBCA
          type: string
        last_price:
          description: Most recent execution price for this emiten. Null if never
            traded.
          example: 8050
          format: int64
          type: integer
        participant:
          example: YP
          type: string
        updated_at:
          description: When this holding last changed.
          example: "2026-07-30T09:15:02Z"
          type: string
        value:
          description: |-
            Market value: last_price × amount_shared. Derived on read, so it always
            reflects the latest trade even when this broker did not trade. Null if the
            instrument has never traded.
          example: 8050000000
          format: int64
          type: integer
      type: object
    emiten.CreateRequest:
      properties:
        kode:
          description: Instrument code, unique across the exchange.
          example: BBNI
          type: string
        listed_shares:
          description: Publicly tradeable shares. Must be > 0.
          example: 18462169893
          format: int64
          type: integer
        nama:
          description: Company name.
          example: Bank Negara Indonesia Tbk
          type: string
        unlisted_shares:
          description: Restricted shares not available for trading. Defaults to 0.
          example: 0
          format: int64
          type: integer
      required:
      - kode
      - listed_shares
      - nama
      type: object
    emiten.EmitenDetail:
      properties:
        current_price:
          description: Most recent execution price. Null if never traded.
          example: 8050
          format: int64
          type: integer
        free_float_percentage:
          description: |-
            Share of total shares that is publicly tradeable. Null when there are no
            shares at all. Always sums to 100 with UnlistedPercentage.
          example: 99.2
          type: number
        highest_price:
          description: Highest price ever executed. Null if never traded.
          example: 8200
          format: int64
          type: integer
        is_active:
          description: Whether the instrument accepts new orders.
          example: true
          type: boolean
        kode:
          example: BBCA
          type: string
        listed_shares:
          example: 123275050000
          format: int64
          type: integer
        lowest_price:
          description: Lowest price ever executed. Null if never traded.
          example: 7800
          format: int64
          type: integer
        nama:
          example: Bank Central Asia Tbk
          type: string
        total_shares:
          example: 124275050000
          format: int64
          type: integer
        unlisted_percentage:
          description: Share of total shares that is restricted. Null when there are
            no shares.
          example: 0.8
          type: number
        unlisted_shares:
          example: 1000000000
          format: int64
          type: integer
        value:
          description: 'Market capitalisation: current price × total shares. Null
            if never traded.'
          example: 1000414152500000
          format: int64
          type: integer
      type: object
    emiten.EmitenView:
      properties:
        is_active:
          description: |-
            Whether the instrument accepts new orders. An inactive emiten still has a
            readable book and history.
          example: true
          type: boolean
        kode:
          example: BBCA
          type: string
        listed_shares:
          example: 123275050000
          format: int64
          type: integer
        nama:
          example: Bank Central Asia Tbk
          type: string
        total_shares:
          example: 124275050000
          format: int64
          type: integer
        unlisted_shares:
          example: 1000000000
          format: int64
          type: integer
      type: object
    httpx.ErrorResponse:
      properties:
        error:
          type: string
      type: object
    httpx.Page-assets_HoldingView:
      properties:
        data:
          items:
            $ref: '#/components/schemas/assets.HoldingView'
          type: array
          uniqueItems: false
        limit:
          type: integer
        page:
          type: integer
        total:
          type: integer
      type: object
    httpx.Page-emiten_EmitenView:
      properties:
        data:
          items:
            $ref: '#/components/schemas/emiten.EmitenView'
          type: array
          uniqueItems: false
        limit:
          type: integer
        page:
          type: integer
        total:
          type: integer
      type: object
    httpx.Page-order_OrderHistoryView:
      properties:
        data:
          items:
            $ref: '#/components/schemas/order.OrderHistoryView'
          type: array
          uniqueItems: false
        limit:
          type: integer
        page:
          type: integer
        total:
          type: integer
      type: object
    httpx.Page-orderbook_BookSnapshot:
      properties:
        data:
          items:
            $ref: '#/components/schemas/orderbook.BookSnapshot'
          type: array
          uniqueItems: false
        limit:
          type: integer
        page:
          type: integer
        total:
          type: integer
      type: object
    httpx.Page-trade_TickView:
      properties:
        data:
          items:
            $ref: '#/components/schemas/trade.TickView'
          type: array
          uniqueItems: false
        limit:
          type: integer
        page:
          type: integer
        total:
          type: integer
      type: object
    httpx.Page-trade_TradeView:
      properties:
        data:
          items:
            $ref: '#/components/schemas/trade.TradeView'
          type: array
          uniqueItems: false
        limit:
          type: integer
        page:
          type: integer
        total:
          type: integer
      type: object
    httpx.Page-trade_TransactionView:
      properties:
        data:
          items:
            $ref: '#/components/schemas/trade.TransactionView'
          type: array
          uniqueItems: false
        limit:
          type: integer
        page:
          type: integer
        total:
          type: integer
      type: object
    httpx.Page-wallet_WalletView:
      properties:
        data:
          items:
            $ref: '#/components/schemas/wallet.WalletView'
          type: array
          uniqueItems: false
        limit:
          type: integer
        page:
          type: integer
        total:
          type: integer
      type: object
    order.OrderHistoryView:
      properties:
        emiten:
          example: BBCA
          type: string
        id:
          example: 31
          format: int64
          type: integer
        participant:
          example: YP
          type: string
        price:
          description: 0 for a market order, which carries no price.
          example: 8000
          format: int64
          type: integer
        qty:
          example: 100
          format: int64
          type: integer
        remaining:
          description: Quantity not yet filled.
          example: 0
          format: int64
          type: integer
        seq:
          example: 31
          format: int64
          type: integer
        side:
          enum:
          - buy
          - sell
          example: buy
          type: string
        status:
          enum:
          - open
          - filled
          - cancelled
          example: filled
          type: string
        type:
          enum:
          - limit
          - market
          example: limit
          type: string
      type: object
    order.OrderView:
      properties:
        id:
          description: Database id of the order.
          example: 3
          format: int64
          type: integer
        remaining:
          description: Quantity not yet filled.
          example: 0
          format: int64
          type: integer
        status:
          description: Lifecycle state after matching.
          enum:
          - open
          - filled
          - cancelled
          example: filled
          type: string
      type: object
    order.SubmitOrderRequest:
      properties:
        emiten:
          description: Emiten (listed instrument) code.
          example: BBCA
          type: string
        participant:
          description: Participant (broker) code.
          example: YP
          type: string
        price:
          description: |-
            Whole rupiah, never a float. Required and > 0 for a limit order; ignored
            and stored as 0 for a market order.
          example: 8000
          format: int64
          type: integer
        qty:
          description: Quantity to trade. Must be > 0.
          example: 100
          format: int64
          minimum: 1
          type: integer
        side:
          description: Order direction.
          enum:
          - buy
          - sell
          example: buy
          type: string
        type:
          description: Order type. A market order never rests in the book.
          enum:
          - limit
          - market
          example: limit
          type: string
      required:
      - emiten
      - participant
      - qty
      - side
      - type
      type: object
    order.SubmitOrderResponse:
      properties:
        order:
          $ref: '#/components/schemas/order.OrderView'
        trades:
          items:
            $ref: '#/components/schemas/order.TradeView'
          type: array
          uniqueItems: false
      type: object
    order.TradeView:
      properties:
        buy_order_id:
          description: Id of the buy side of this execution.
          example: 3
          format: int64
          type: integer
        price:
          description: Execution price, which is always the passive (resting) order's
            price.
          example: 8000
          format: int64
          type: integer
        qty:
          description: Quantity executed.
          example: 100
          format: int64
          type: integer
        sell_order_id:
          description: Id of the sell side of this execution.
          example: 1
          format: int64
          type: integer
      type: object
    orderbook.BookSnapshot:
      properties:
        asks:
          description: Sell side, lowest price first.
          items:
            $ref: '#/components/schemas/orderbook.PriceLevel'
          type: array
          uniqueItems: false
        bids:
          description: Buy side, highest price first.
          items:
            $ref: '#/components/schemas/orderbook.PriceLevel'
          type: array
          uniqueItems: false
        emiten:
          description: Emiten code this book belongs to.
          example: BBCA
          type: string
        type:
          description: Present as "update" on WebSocket pushes; omitted on REST responses.
          example: update
          type: string
      type: object
    orderbook.PriceLevel:
      properties:
        price:
          example: 8050
          format: int64
          type: integer
        qty:
          example: 30
          format: int64
          type: integer
      type: object
    participant.CreateRequest:
      properties:
        kode:
          description: Broker code, unique across the exchange.
          example: BB
          type: string
        nama:
          description: Broker display name.
          example: Broker B
          type: string
      required:
      - kode
      - nama
      type: object
    participant.IssuedKeyResponse:
      properties:
        api_key:
          description: The full API key. Store it now; it is not retrievable later.
          example: jast_BB_9xQ2mR7tL4nK8wZ3yB6cF1hJ5dS0gAv2
          type: string
        kode:
          example: BB
          type: string
        nama:
          example: Broker B
          type: string
      type: object
    participant.KeyRequest:
      properties:
        participant:
          example: YP
          type: string
      required:
      - participant
      type: object
    participant.ParticipantView:
      properties:
        api_key_issued_at:
          description: When the current key was issued. Null when none is issued.
          example: "2026-07-30T09:14:22Z"
          type: string
        api_key_prefix:
          description: Leading fragment of the key, for identification. Null when
            none is issued.
          example: jast_YP_8fK2
          type: string
        has_api_key:
          description: Whether a key has been issued to this broker.
          example: true
          type: boolean
        kode:
          example: YP
          type: string
        nama:
          example: Mirae Asset Sekuritas
          type: string
      type: object
    trade.CandleView:
      properties:
        close:
          example: 8050
          format: int64
          type: integer
        high:
          example: 8100
          format: int64
          type: integer
        low:
          example: 7950
          format: int64
          type: integer
        open:
          example: 8000
          format: int64
          type: integer
        time:
          description: Start of the bucket, UTC-aligned.
          example: "2026-07-30T09:00:00Z"
          type: string
        volume:
          example: 12400
          format: int64
          type: integer
      type: object
    trade.TickView:
      properties:
        executed_at:
          example: "2026-07-30T09:15:02Z"
          type: string
        price:
          example: 8050
          format: int64
          type: integer
        qty:
          example: 30
          format: int64
          type: integer
        seq:
          example: 412
          format: int64
          type: integer
      type: object
    trade.TradeView:
      properties:
        buy_order_id:
          example: 31
          format: int64
          type: integer
        buyer:
          example: YP
          type: string
        emiten:
          example: BBCA
          type: string
        executed_at:
          example: "2026-07-30T09:15:02Z"
          type: string
        id:
          example: 412
          format: int64
          type: integer
        price:
          example: 8000
          format: int64
          type: integer
        qty:
          example: 500
          format: int64
          type: integer
        sell_order_id:
          example: 28
          format: int64
          type: integer
        seller:
          example: PD
          type: string
        seq:
          example: 412
          format: int64
          type: integer
        value:
          example: 4000000
          format: int64
          type: integer
      type: object
    trade.TransactionView:
      properties:
        counterparty:
          description: The broker on the other side.
          example: PD
          type: string
        emiten:
          example: BBCA
          type: string
        executed_at:
          example: "2026-07-30T09:15:02Z"
          type: string
        price:
          example: 8000
          format: int64
          type: integer
        qty:
          example: 500
          format: int64
          type: integer
        seq:
          example: 412
          format: int64
          type: integer
        side:
          description: Which side this broker was on.
          enum:
          - buy
          - sell
          example: buy
          type: string
        trade_id:
          example: 412
          format: int64
          type: integer
        value:
          description: price × qty.
          example: 4000000
          format: int64
          type: integer
      type: object
    wallet.WalletView:
      properties:
        balance:
          description: Cash balance held by this broker.
          example: 5000000000
          format: int64
          type: integer
        participant:
          example: YP
          type: string
        updated_at:
          description: When this balance last changed.
          example: "2026-07-30T09:15:02Z"
          type: string
      type: object
  securitySchemes:
    ApiKeyAuth:
      description: Static administrative key, from configuration. Guards every /api/admin route.
      in: header
      name: X-API-Key
      type: apiKey
    ParticipantKeyAuth:
      description: Per-broker key, issued by an admin and stored hashed. Guards every /api/participant route. Returned once at issue and never retrievable again.
      in: header
      name: X-Participant-Key
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  description: |-
    REST surface for the JAST core matching engine (JATS-style continuous
    matching for Bursa Efek Indonesia). The engine knows only brokers
    (participants), not individual investors, and stops at trade execution.


    There are two authentication tiers, and they never mix:

    - **Participant** (`/api/participant/*`, `/ws/participant/*`) — a broker
    authenticates with its own key, stored hashed in the database and sent as
    `X-Participant-Key`. Keys are issued and revoked per broker at runtime.
    - **Admin** (`/api/admin/*`, `/ws/admin/*`) — the single static key from
    configuration, sent as `X-API-Key`.

    Orders enter only through POST /api/participant/orders. The order book can
    be polled or streamed over WebSocket (documented, but not exercisable from
    Swagger UI, since browsers cannot set headers on a WS handshake).
  title: JAST Core API
  version: 1.0.0
openapi: 3.0.3
paths:
  /api/admin/assets:
    get:
      description: Every broker's holdings, or one broker's when `participant` is
        given.
      operationId: listAssets
      parameters:
      - description: Filter by broker code
        example: YP
        in: query
        name: participant
        schema:
          type: string
      - description: Page number, from 1
        in: query
        name: page
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: Items per page, max 100
        in: query
        name: limit
        schema:
          default: 10
          maximum: 100
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.Page-assets_HoldingView'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-API-Key
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unknown participant
      security:
      - ApiKeyAuth: []
      summary: Share holdings across brokers
      tags:
      - admin
  /api/admin/emiten:
    get:
      description: |-
        Master data for every emiten, ordered by code. Price statistics are
        deliberately excluded — computing them per row would be a query per
        instrument. Use the detail endpoint for those.
      operationId: listEmiten
      parameters:
      - description: Page number, from 1
        in: query
        name: page
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: Items per page, max 100
        in: query
        name: limit
        schema:
          default: 10
          maximum: 100
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.Page-emiten_EmitenView'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-API-Key
      security:
      - ApiKeyAuth: []
      summary: List listed instruments
      tags:
      - admin
    post:
      description: |-
        Creates an emiten and registers it with an empty order book, so it is
        tradeable immediately — no restart required. It starts active.
      operationId: createEmiten
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/emiten.CreateRequest'
              description: Instrument to list
              summary: body
        description: Instrument to list
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/emiten.EmitenView'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing kode/nama, or listed_shares <= 0
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-API-Key
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Instrument code already exists
      security:
      - ApiKeyAuth: []
      summary: List a new instrument
      tags:
      - admin
  /api/admin/orders:
    get:
      description: |-
        Every order ever submitted, newest first, optionally filtered by emiten,
        participant, or status. This is the audit trail; the live book is served
        by the orderbook endpoints.
      operationId: listOrders
      parameters:
      - description: Filter by emiten code
        example: BBCA
        in: query
        name: emiten
        schema:
          type: string
      - description: Filter by broker code
        example: YP
        in: query
        name: participant
        schema:
          type: string
      - description: Filter by status
        in: query
        name: status
        schema:
          enum:
          - open
          - filled
          - cancelled
          type: string
      - description: Page number, from 1
        in: query
        name: page
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: Items per page, max 100
        in: query
        name: limit
        schema:
          default: 10
          maximum: 100
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.Page-order_OrderHistoryView'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unknown emiten/participant, or bad status
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-API-Key
      security:
      - ApiKeyAuth: []
      summary: List order history
      tags:
      - admin
  /api/admin/participants:
    get:
      description: |-
        Every exchange participant, ordered by code. API keys are **not** included
        and cannot be: only their hashes are stored. The prefix identifies which
        key is in place without exposing it.
      operationId: listParticipants
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/participant.ParticipantView'
                type: array
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-API-Key
      security:
      - ApiKeyAuth: []
      summary: List brokers
      tags:
      - admin
    post:
      description: |-
        Registers an exchange participant and issues its first API key.
        The key is returned **once, in this response only** — it is stored as a
        SHA-256 hash and cannot be retrieved again. A lost key is re-issued, not
        recovered.
      operationId: createParticipant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/participant.CreateRequest'
              description: Broker to create
              summary: body
        description: Broker to create
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/participant.IssuedKeyResponse'
          description: Created; contains the only copy of the key
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing kode or nama
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-API-Key
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Broker code already exists
      security:
      - ApiKeyAuth: []
      summary: Create a broker
      tags:
      - admin
  /api/admin/participants/apikey:
    delete:
      description: |-
        Removes the key. The next request carrying it is rejected immediately —
        authentication reads the database rather than a cache, so revocation is
        not delayed by an expiry.
      operationId: revokeParticipantKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/participant.KeyRequest'
              description: Target broker
              summary: body
        description: Target broker
        required: true
      responses:
        "204":
          description: Revoked
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unknown participant
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-API-Key
      security:
      - ApiKeyAuth: []
      summary: Revoke a broker's API key
      tags:
      - admin
    post:
      description: |-
        Mints a new key and invalidates the previous one immediately. The key is
        returned once and never again. The target broker travels in the body, not
        the path, so no identifier lands in access or proxy logs.
      operationId: issueParticipantKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/participant.KeyRequest'
              description: Target broker
              summary: body
        description: Target broker
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/participant.IssuedKeyResponse'
          description: The only copy of the new key
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unknown participant
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-API-Key
      security:
      - ApiKeyAuth: []
      summary: Re-issue a broker's API key
      tags:
      - admin
  /api/admin/trades:
    get:
      description: |-
        The raw execution log, newest first, optionally filtered by emiten or
        participant. Each row is one buy order matched against one sell order.
      operationId: listTrades
      parameters:
      - description: Filter by emiten code
        example: BBCA
        in: query
        name: emiten
        schema:
          type: string
      - description: Filter by broker code
        example: YP
        in: query
        name: participant
        schema:
          type: string
      - description: Page number, from 1
        in: query
        name: page
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: Items per page, max 100
        in: query
        name: limit
        schema:
          default: 10
          maximum: 100
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.Page-trade_TradeView'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-API-Key
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unknown emiten or participant filter
      security:
      - ApiKeyAuth: []
      summary: List executions
      tags:
      - admin
  /api/admin/transactions:
    get:
      description: |-
        Fills seen from a broker's own side. Omit `participant` to include every
        broker. A broker that matched its own resting order appears twice for
        that execution, once per side.
      operationId: adminTransactions
      parameters:
      - description: Broker code
        example: YP
        in: query
        name: participant
        required: true
        schema:
          type: string
      - description: Filter by emiten code
        example: BBCA
        in: query
        name: emiten
        schema:
          type: string
      - description: Page number, from 1
        in: query
        name: page
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: Items per page, max 100
        in: query
        name: limit
        schema:
          default: 10
          maximum: 100
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.Page-trade_TransactionView'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: participant is required
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-API-Key
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unknown participant or emiten
      security:
      - ApiKeyAuth: []
      summary: Transaction history for any broker
      tags:
      - admin
  /api/admin/wallets:
    get:
      description: Every broker's cash balance, or one broker's when `participant`
        is given.
      operationId: listWallets
      parameters:
      - description: Filter by broker code
        example: YP
        in: query
        name: participant
        schema:
          type: string
      - description: Page number, from 1
        in: query
        name: page
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: Items per page, max 100
        in: query
        name: limit
        schema:
          default: 10
          maximum: 100
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.Page-wallet_WalletView'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-API-Key
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unknown participant
      security:
      - ApiKeyAuth: []
