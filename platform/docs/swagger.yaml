components:
  schemas:
    assets.HoldingView:
      properties:
        amount_shared:
          description: Shares held.
          example: 1000000
          format: int64
          type: integer
        emiten:
          example: BBCA
          type: string
        last_price:
          description: Most recent execution price for this emiten. Null if never
            traded.
          example: 8050
          format: int64
          type: integer
        participant:
          example: YP
          type: string
        price_source:
          description: |-
            Where reference_price came from: "trade" or "ipo". Omitted when there is no
            reference price at all.
          enum:
          - trade
          - ipo
          example: trade
          type: string
        reference_price:
          description: |-
            Price backing the valuation: the last trade, or the IPO price until the
            instrument first trades. Null only if it has neither.
          example: 8050
          format: int64
          type: integer
        updated_at:
          description: When this holding last changed.
          example: "2026-07-30T09:15:02Z"
          type: string
        value:
          description: |-
            Market value: reference_price × amount_shared. Derived on read, so it always
            reflects the latest trade even when this broker did not trade. Null only when
            the instrument has neither a trade nor an IPO price.
          example: 8050000000
          format: int64
          type: integer
      type: object
    emiten.CreateRequest:
      properties:
        ipo_price:
          description: |-
            Offering price. Must be > 0: it is the instrument's reference price until it
            first trades, and without it a new listing has no price to quote against.
          example: 1000
          format: int64
          type: integer
        kode:
          description: Instrument code, unique across the exchange.
          example: BBNI
          type: string
        listed_shares:
          description: Publicly tradeable shares. Must be > 0.
          example: 18462169893
          format: int64
          type: integer
        nama:
          description: Company name.
          example: Bank Negara Indonesia Tbk
          type: string
        unlisted_shares:
          description: Restricted shares not available for trading. Defaults to 0.
          example: 0
          format: int64
          type: integer
      required:
      - ipo_price
      - kode
      - listed_shares
      - nama
      type: object
    emiten.EmitenDetail:
      properties:
        current_price:
          description: Most recent execution price. Null if never traded.
          example: 8050
          format: int64
          type: integer
        free_float_percentage:
          description: |-
            Share of total shares that is publicly tradeable. Null when there are no
            shares at all. Always sums to 100 with UnlistedPercentage.
          example: 99.2
          type: number
        highest_price:
          description: Highest price ever executed. Null if never traded.
          example: 8200
          format: int64
          type: integer
        ipo_price:
          description: |-
            Offering price this instrument was listed at. Null for instruments listed
            before the field existed.
          example: 1000
          format: int64
          type: integer
        is_active:
          description: Whether the instrument accepts new orders.
          example: true
          type: boolean
        kode:
          example: BBCA
          type: string
        listed_shares:
          example: 123275050000
          format: int64
          type: integer
        lowest_price:
          description: Lowest price ever executed. Null if never traded.
          example: 7800
          format: int64
          type: integer
        nama:
          example: Bank Central Asia Tbk
          type: string
        price_source:
          description: |-
            Where reference_price came from: "trade" or "ipo". Omitted when there is no
            reference price at all.
          enum:
          - trade
          - ipo
          example: trade
          type: string
        reference_price:
          description: |-
            Price backing the valuation: the last trade, or ipo_price until the
            instrument first trades. Null only if it has neither.
          example: 8050
          format: int64
          type: integer
        total_shares:
          example: 124275050000
          format: int64
          type: integer
        unlisted_percentage:
          description: Share of total shares that is restricted. Null when there are
            no shares.
          example: 0.8
          type: number
        unlisted_shares:
          example: 1000000000
          format: int64
          type: integer
        value:
          description: |-
            Market capitalisation: reference price × total shares. Null only when the
            instrument has neither a trade nor an IPO price.
          example: 1000414152500000
          format: int64
          type: integer
      type: object
    emiten.EmitenView:
      properties:
        is_active:
          description: |-
            Whether the instrument accepts new orders. An inactive emiten still has a
            readable book and history.
          example: true
          type: boolean
        kode:
          example: BBCA
          type: string
        listed_shares:
          example: 123275050000
          format: int64
          type: integer
        nama:
          example: Bank Central Asia Tbk
          type: string
        total_shares:
          example: 124275050000
          format: int64
          type: integer
        unlisted_shares:
          example: 1000000000
          format: int64
          type: integer
      type: object
    httpx.ErrorResponse:
      properties:
        error:
          type: string
      type: object
    httpx.Page-assets_HoldingView:
      properties:
        data:
          items:
            $ref: '#/components/schemas/assets.HoldingView'
          type: array
          uniqueItems: false
        limit:
          type: integer
        page:
          type: integer
        total:
          type: integer
      type: object
    httpx.Page-emiten_EmitenView:
      properties:
        data:
          items:
            $ref: '#/components/schemas/emiten.EmitenView'
          type: array
          uniqueItems: false
        limit:
          type: integer
        page:
          type: integer
        total:
          type: integer
      type: object
    httpx.Page-index_SnapshotView:
      properties:
        data:
          items:
            $ref: '#/components/schemas/index.SnapshotView'
          type: array
          uniqueItems: false
        limit:
          type: integer
        page:
          type: integer
        total:
          type: integer
      type: object
    httpx.Page-order_OrderHistoryView:
      properties:
        data:
          items:
            $ref: '#/components/schemas/order.OrderHistoryView'
          type: array
          uniqueItems: false
        limit:
          type: integer
        page:
          type: integer
        total:
          type: integer
      type: object
    httpx.Page-orderbook_BookSnapshot:
      properties:
        data:
          items:
            $ref: '#/components/schemas/orderbook.BookSnapshot'
          type: array
          uniqueItems: false
        limit:
          type: integer
        page:
          type: integer
        total:
          type: integer
      type: object
    httpx.Page-trade_TickView:
      properties:
        data:
          items:
            $ref: '#/components/schemas/trade.TickView'
          type: array
          uniqueItems: false
        limit:
          type: integer
        page:
          type: integer
        total:
          type: integer
      type: object
    httpx.Page-trade_TradeView:
      properties:
        data:
          items:
            $ref: '#/components/schemas/trade.TradeView'
          type: array
          uniqueItems: false
        limit:
          type: integer
        page:
          type: integer
        total:
          type: integer
      type: object
    httpx.Page-trade_TransactionView:
      properties:
        data:
          items:
            $ref: '#/components/schemas/trade.TransactionView'
          type: array
          uniqueItems: false
        limit:
          type: integer
        page:
          type: integer
        total:
          type: integer
      type: object
    httpx.Page-wallet_WalletView:
      properties:
        data:
          items:
            $ref: '#/components/schemas/wallet.WalletView'
          type: array
          uniqueItems: false
        limit:
          type: integer
        page:
          type: integer
        total:
          type: integer
      type: object
    index.IndexView:
      properties:
        captured_at:
          example: "2026-07-30T09:15:02Z"
          type: string
        divisor:
          description: |-
            The divisor in force. It is restated whenever an instrument lists, so the
            level does not jump on an event that moved no price.
          example: 1000000000000
          type: number
        kode:
          example: IHSG
          type: string
        market_cap:
          description: |-
            Summed free-float market capitalisation of every priced instrument, in
            rupiah.
          example: 1247830000000000
          format: int64
          type: integer
        members:
          description: How many instruments were priced into this level.
          example: 5
          type: integer
        nama:
          example: Indeks Harga Saham Gabungan
          type: string
        total:
          description: |-
            How many instruments are listed in total. members below this means some
            instrument has no price at all and was excluded rather than counted as zero.
          example: 5
          type: integer
        value:
          description: The index level, rounded to two decimals.
          example: 1247.83
          type: number
      type: object
    index.SnapshotView:
      properties:
        captured_at:
          example: "2026-07-30T09:15:02Z"
          type: string
        divisor:
          example: 1000000000000
          type: number
        market_cap:
          example: 1247830000000000
          format: int64
          type: integer
        members:
          example: 5
          type: integer
        value:
          example: 1247.83
          type: number
      type: object
    marketconfig.ConfigView:
      properties:
        emiten_halt_bps:
          description: |-
            How far one emiten's price may move from its reference price before
            trading in it is halted, in basis points. 3000 is 30%.
          example: 3000
          format: int64
          type: integer
        halt_duration_seconds:
          description: How long a triggered halt lasts, in seconds.
          example: 120
          format: int64
          type: integer
        index_halt_bps:
          description: |-
            How far the index may fall from its opening value before trading halts
            market-wide, in basis points. 1200 is 12%.
          example: 1200
          format: int64
          type: integer
        min_price:
          description: |-
            The lowest price a limit order may be submitted at, in rupiah. An order
            priced below it is rejected with 400 and never reaches the order book.
          example: 50
          format: int64
          type: integer
      type: object
    marketconfig.UpdateRequest:
      properties:
        emiten_halt_bps:
          description: |-
            New single-emiten halt threshold in basis points, must be in 1..10000.
            Omit to leave it unchanged.
          example: 3000
          format: int64
          type: integer
        halt_duration_seconds:
          description: |-
            New halt duration in seconds, must be in 1..86400. Omit to leave it
            unchanged.
          example: 120
          format: int64
          type: integer
        index_halt_bps:
          description: |-
            New market-wide halt threshold in basis points, must be in 1..10000. Omit
            to leave it unchanged.
          example: 1200
          format: int64
          type: integer
        min_price:
          description: New price floor in rupiah, must be > 0. Omit to leave it unchanged.
          example: 50
          format: int64
          type: integer
      type: object
    order.OrderHistoryView:
      properties:
        emiten:
          example: BBCA
          type: string
        id:
          example: 31
          format: int64
          type: integer
        participant:
          example: YP
          type: string
        price:
          description: 0 for a market order, which carries no price.
          example: 8000
          format: int64
          type: integer
        qty:
          example: 100
          format: int64
          type: integer
        remaining:
          description: Quantity not yet filled.
          example: 0
          format: int64
          type: integer
        seq:
          example: 31
          format: int64
          type: integer
        side:
          enum:
          - buy
          - sell
          example: buy
          type: string
        status:
          enum:
          - open
          - filled
          - cancelled
          example: filled
          type: string
        type:
          enum:
          - limit
          - market
          example: limit
          type: string
      type: object
    order.OrderView:
      properties:
        id:
          description: Database id of the order.
          example: 3
          format: int64
          type: integer
        remaining:
          description: Quantity not yet filled.
          example: 0
          format: int64
          type: integer
        status:
          description: Lifecycle state after matching.
          enum:
          - open
          - filled
          - cancelled
          example: filled
          type: string
      type: object
    order.SubmitOrderRequest:
      properties:
        emiten:
          description: Emiten (listed instrument) code.
          example: BBCA
          type: string
        participant:
          description: Participant (broker) code.
          example: YP
          type: string
        price:
          description: |-
            Whole rupiah, never a float. Required and > 0 for a limit order; ignored
            and stored as 0 for a market order.
          example: 8000
          format: int64
          type: integer
        qty:
          description: Quantity to trade. Must be > 0.
          example: 100
          format: int64
          minimum: 1
          type: integer
        side:
          description: Order direction.
          enum:
          - buy
          - sell
          example: buy
          type: string
        type:
          description: Order type. A market order never rests in the book.
          enum:
          - limit
          - market
          example: limit
          type: string
      required:
      - emiten
      - participant
      - qty
      - side
      - type
      type: object
    order.SubmitOrderResponse:
      properties:
        order:
          $ref: '#/components/schemas/order.OrderView'
        trades:
          items:
            $ref: '#/components/schemas/order.TradeView'
          type: array
          uniqueItems: false
      type: object
    order.TradeView:
      properties:
        buy_order_id:
          description: Id of the buy side of this execution.
          example: 3
          format: int64
          type: integer
        price:
          description: Execution price, which is always the passive (resting) order's
            price.
          example: 8000
          format: int64
          type: integer
        qty:
          description: Quantity executed.
          example: 100
          format: int64
          type: integer
        sell_order_id:
          description: Id of the sell side of this execution.
          example: 1
          format: int64
          type: integer
      type: object
    orderbook.BookSnapshot:
      properties:
        asks:
          description: Sell side, lowest price first.
          items:
            $ref: '#/components/schemas/orderbook.PriceLevel'
          type: array
          uniqueItems: false
        bids:
          description: Buy side, highest price first.
          items:
            $ref: '#/components/schemas/orderbook.PriceLevel'
          type: array
          uniqueItems: false
        emiten:
          description: Emiten code this book belongs to.
          example: BBCA
          type: string
        type:
          description: Present as "update" on WebSocket pushes; omitted on REST responses.
          example: update
          type: string
      type: object
    orderbook.PriceLevel:
      properties:
        price:
          example: 8050
          format: int64
          type: integer
        qty:
          example: 30
          format: int64
          type: integer
      type: object
    participant.CreateRequest:
      properties:
        kode:
          description: Broker code, unique across the exchange.
          example: BB
          type: string
        nama:
          description: Broker display name.
          example: Broker B
          type: string
      required:
      - kode
      - nama
      type: object
    participant.IssuedKeyResponse:
      properties:
        api_key:
          description: The full API key. Store it now; it is not retrievable later.
          example: jast_BB_9xQ2mR7tL4nK8wZ3yB6cF1hJ5dS0gAv2
          type: string
        kode:
          example: BB
          type: string
        nama:
          example: Broker B
          type: string
      type: object
    participant.KeyRequest:
      properties:
        participant:
          example: YP
          type: string
      required:
      - participant
      type: object
    participant.ParticipantView:
      properties:
        api_key_issued_at:
          description: When the current key was issued. Null when none is issued.
          example: "2026-07-30T09:14:22Z"
          type: string
        api_key_prefix:
          description: Leading fragment of the key, for identification. Null when
            none is issued.
          example: jast_YP_8fK2
          type: string
        has_api_key:
          description: Whether a key has been issued to this broker.
          example: true
          type: boolean
        kode:
          example: YP
          type: string
        nama:
          example: Mirae Asset Sekuritas
          type: string
      type: object
    trade.CandleView:
      properties:
        close:
          example: 8050
          format: int64
          type: integer
        high:
          example: 8100
          format: int64
          type: integer
        low:
          example: 7950
          format: int64
          type: integer
        open:
          example: 8000
          format: int64
          type: integer
        time:
          description: Start of the bucket, UTC-aligned.
          example: "2026-07-30T09:00:00Z"
          type: string
        volume:
          example: 12400
          format: int64
          type: integer
      type: object
    trade.TickView:
      properties:
        executed_at:
          example: "2026-07-30T09:15:02Z"
          type: string
        price:
          example: 8050
          format: int64
          type: integer
        qty:
          example: 30
          format: int64
          type: integer
        seq:
          example: 412
          format: int64
          type: integer
      type: object
    trade.TradeView:
      properties:
        buy_order_id:
          example: 31
          format: int64
          type: integer
        buyer:
          example: YP
          type: string
        emiten:
          example: BBCA
          type: string
        executed_at:
          example: "2026-07-30T09:15:02Z"
          type: string
        id:
          example: 412
          format: int64
          type: integer
        price:
          example: 8000
          format: int64
          type: integer
        qty:
          example: 500
          format: int64
          type: integer
        sell_order_id:
          example: 28
          format: int64
          type: integer
        seller:
          example: PD
          type: string
        seq:
          example: 412
          format: int64
          type: integer
        value:
          example: 4000000
          format: int64
          type: integer
      type: object
    trade.TransactionView:
      properties:
        counterparty:
          description: The broker on the other side.
          example: PD
          type: string
        emiten:
          example: BBCA
          type: string
        executed_at:
          example: "2026-07-30T09:15:02Z"
          type: string
        price:
          example: 8000
          format: int64
          type: integer
        qty:
          example: 500
          format: int64
          type: integer
        seq:
          example: 412
          format: int64
          type: integer
        side:
          description: Which side this broker was on.
          enum:
          - buy
          - sell
          example: buy
          type: string
        trade_id:
          example: 412
          format: int64
          type: integer
        value:
          description: price × qty.
          example: 4000000
          format: int64
          type: integer
      type: object
    underwriter.AllocationView:
      properties:
        jenis:
          description: 'Role in this offering: "utama" or "pendukung".'
          enum:
          - utama
          - pendukung
          example: utama
          type: string
        nama:
          example: Danareksa Sekuritas
          type: string
        participant:
          description: Broker code the shares were credited to.
          example: YP
          type: string
        percentage:
          description: Share of listed_shares this tranche represents, to two decimals.
          example: 62.5
          type: number
        shares:
          description: Shares allocated.
          example: 25000
          format: int64
          type: integer
        underwriter:
          example: UW01
          type: string
        value:
          description: 'Proceeds for this tranche: shares × ipo_price.'
          example: 25000000
          format: int64
          type: integer
      type: object
    underwriter.CreateRequest:
      properties:
        jenis:
          description: 'Role: "utama" (lead) or "pendukung" (supporting).'
          enum:
          - utama
          - pendukung
          example: utama
          type: string
        kode:
          description: Underwriter code, unique across the exchange.
          example: UW03
          type: string
        nama:
          description: Firm name.
          example: BNI Sekuritas
          type: string
        participant:
          description: |-
            Broker code this underwriter trades through. Allocated shares land in this
            participant's holdings, because only a participant can trade them.
          example: YP
          type: string
      required:
      - jenis
      - kode
      - nama
      - participant
      type: object
    underwriter.IPORequest:
      properties:
        ipo_price:
          description: |-
            Offering price per share. Must be > 0; becomes the instrument's reference
            price until it first trades.
          example: 1000
          format: int64
          type: integer
        kode:
          description: Instrument code, unique across the exchange.
          example: SSIA
          type: string
        listed_shares:
          description: Publicly tradeable shares. The allocations must sum to exactly
            this.
          example: 40000
          format: int64
          type: integer
        nama:
          description: Company name.
          example: PT Surya Cipta Semesta Tbk
          type: string
        underwriters:
          description: |-
            The syndicate. At least one entry, exactly one of which must be "utama",
            and the lead's tranche must be the largest.
          items:
            $ref: '#/components/schemas/underwriter.UnderwriterAllocation'
          type: array
          uniqueItems: false
        unlisted_shares:
          description: Restricted shares not available for trading. Defaults to 0.
          example: 10000
          format: int64
          type: integer
      required:
      - ipo_price
      - kode
      - listed_shares
      - nama
      - underwriters
      type: object
    underwriter.IPOResponse:
      properties:
        ipo_price:
          description: Offering price per share.
          example: 1000
          format: int64
          type: integer
        kode:
          example: SSIA
          type: string
        listed_shares:
          example: 40000
          format: int64
          type: integer
        nama:
          example: PT Surya Cipta Semesta Tbk
          type: string
        total_shares:
          example: 50000
          format: int64
          type: integer
        total_value:
          description: 'Total raised: listed_shares × ipo_price.'
          example: 40000000
          format: int64
          type: integer
        underwriters:
          description: The syndicate, lead first.
          items:
            $ref: '#/components/schemas/underwriter.AllocationView'
          type: array
          uniqueItems: false
        unlisted_shares:
          example: 10000
          format: int64
          type: integer
      type: object
    underwriter.UnderwriterAllocation:
      properties:
        shares:
          description: Shares allocated. Must be > 0.
          example: 25000
          format: int64
          type: integer
        underwriter:
          description: Underwriter code taking this tranche.
          example: UW01
          type: string
      required:
      - shares
      - underwriter
      type: object
    underwriter.UnderwriterView:
      properties:
        is_active:
          example: true
          type: boolean
        jenis:
          description: 'Role: "utama" (lead) or "pendukung" (supporting).'
          enum:
          - utama
          - pendukung
          example: utama
          type: string
        kode:
          example: UW01
          type: string
        nama:
          example: Danareksa Sekuritas
          type: string
        participant:
          description: Broker code this underwriter trades through.
          example: YP
          type: string
      type: object
    wallet.WalletView:
      properties:
        balance:
          description: Cash balance held by this broker.
          example: 5000000000
          format: int64
          type: integer
        participant:
          example: YP
          type: string
        updated_at:
          description: When this balance last changed.
          example: "2026-07-30T09:15:02Z"
          type: string
      type: object
  securitySchemes:
    ApiKeyAuth:
      description: Static administrative key, from configuration. Guards every /api/admin route.
      in: header
      name: X-API-Key
      type: apiKey
    ParticipantKeyAuth:
      description: Per-broker key, issued by an admin and stored hashed. Guards every /api/participant route. Returned once at issue and never retrievable again.
      in: header
      name: X-Participant-Key
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  description: |-
    REST surface for the JAST core matching engine (JATS-style continuous
    matching for Bursa Efek Indonesia). The engine knows only brokers
    (participants), not individual investors, and stops at trade execution.


    There are two authentication tiers, and they never mix:

    - **Participant** (`/api/participant/*`, `/ws/participant/*`) — a broker
    authenticates with its own key, stored hashed in the database and sent as
    `X-Participant-Key`. Keys are issued and revoked per broker at runtime.
    - **Admin** (`/api/admin/*`, `/ws/admin/*`) — the single static key from
    configuration, sent as `X-API-Key`.

    Orders enter only through POST /api/participant/orders. The order book can
    be polled or streamed over WebSocket (documented, but not exercisable from
    Swagger UI, since browsers cannot set headers on a WS handshake).
  title: JAST Core API
  version: 1.0.0
openapi: 3.0.3
paths:
  /api/admin/assets:
    get:
      description: Every broker's holdings, or one broker's when `participant` is
        given.
      operationId: listAssets
      parameters:
      - description: Filter by broker code
        example: YP
        in: query
        name: participant
        schema:
          type: string
      - description: Page number, from 1
        in: query
        name: page
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: Items per page, max 100
        in: query
        name: limit
        schema:
          default: 10
          maximum: 100
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.Page-assets_HoldingView'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-API-Key
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unknown participant
      security:
      - ApiKeyAuth: []
      summary: Share holdings across brokers
      tags:
      - admin
  /api/admin/config:
    get:
      description: |-
        The exchange-wide rules in force right now, as the order path is
        actually enforcing them.

        **min_price** is the lowest price a limit order may carry, in rupiah.
        It defaults to **50**, matching BEI's own minimum quotable price. Without
        it the only price rule is `price > 0`, which lets a seller quote 58, then
        5, then 1 — each one accepted, and each one resting in the book as the
        best ask for whatever arrives next.

        The remaining fields configure the circuit breakers. **emiten_halt_bps**
        (default **3000** = 30%) is how far one emiten may move from its reference
        price before trading in it halts; **index_halt_bps** (default **1200** =
        12%) is how far the index may fall from its opening value before trading
        halts market-wide; **halt_duration_seconds** (default **120**) is how long
        either halt lasts.

        Thresholds are in basis points — 1/100th of a percent, so 3000 is 30% —
        because a threshold compared against a rupiah price stays in integer
        arithmetic that way, with no rounding at the boundary that decides whether
        a breaker trips.
      operationId: getMarketConfig
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/marketconfig.ConfigView'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-API-Key
      security:
      - ApiKeyAuth: []
      summary: Read trading parameters
      tags:
      - admin
    put:
      description: |-
        Changes the exchange-wide trading rules. The new value is persisted and
        takes effect on the very next order — no restart, and it survives one.

        Fields left out of the body keep their current value, so one parameter can
        be changed without restating the rest. min_price must be greater than 0: a
        floor of 0 is not a policy, it is the absence of the rule.

        The halt thresholds must be between 1 and 10000 basis points, and the halt
        duration between 1 and 86400 seconds. Both ends are enforced. A threshold
        of 0 does not disable a breaker, it arms one that trips on the first trade
        of the session; a threshold above 100% can never trip, leaving a breaker
        that reads as protection and provides none.
      operationId: updateMarketConfig
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/marketconfig.UpdateRequest'
              description: Parameters to change
              summary: body
        description: Parameters to change
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/marketconfig.ConfigView'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: A parameter is outside its permitted range
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-API-Key
      security:
      - ApiKeyAuth: []
      summary: Update trading parameters
      tags:
      - admin
  /api/admin/emiten:
    get:
      description: |-
        Master data for every emiten, ordered by code. Price statistics are
        deliberately excluded — computing them per row would be a query per
        instrument. Use the detail endpoint for those.
      operationId: listEmiten
      parameters:
      - description: Page number, from 1
        in: query
        name: page
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: Items per page, max 100
        in: query
        name: limit
        schema:
          default: 10
          maximum: 100
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.Page-emiten_EmitenView'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-API-Key
      security:
      - ApiKeyAuth: []
      summary: List listed instruments
      tags:
      - admin
    post:
      description: |-
        Creates an emiten and registers it with an empty order book, so it is
        tradeable immediately — no restart required. It starts active.
      operationId: createEmiten
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/emiten.CreateRequest'
              description: Instrument to list
              summary: body
        description: Instrument to list
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/emiten.EmitenView'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing kode/nama, or listed_shares <= 0
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-API-Key
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Instrument code already exists
      security:
      - ApiKeyAuth: []
      summary: List a new instrument
      tags:
      - admin
  /api/admin/emiten/{kode}:
    get:
      description: |-
        The same instrument detail the participant tier reads, on the admin key —
        so oversight does not require holding a broker's credential. The admin list
        omits price statistics — computing them per row would be a query per
        instrument — so this endpoint is where they are read.

        current_price, highest_price and lowest_price are strictly trade-derived and
        are **null**, not 0, for an instrument that has never traded. reference_price
        is what the instrument is valued at and falls back to ipo_price until the
        first trade; price_source names which of the two it came from.

        value is market capitalisation (reference price × total shares), derived on
        read rather than stored, so it always reflects the latest trade.
        free_float_percentage is the publicly tradeable share of the total and
        always sums to 100 with unlisted_percentage.
      operationId: getAdminEmitenDetail
      parameters:
      - description: Emiten code
        example: BBCA
        in: path
        name: kode
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/emiten.EmitenDetail'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-API-Key
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unknown emiten
      security:
      - ApiKeyAuth: []
      summary: Get instrument detail (admin)
      tags:
      - admin
  /api/admin/ipo:
    post:
      description: |-
        Lists an instrument and hands its shares to the underwriting syndicate in
        one step — an instrument whose shares sit nowhere is not yet an offering.

        The syndicate rules encode what the two roles mean:
        - exactly **one** underwriter with jenis `utama` (the lead that guarantees it)
        - the lead's tranche must be the **largest**; `pendukung` means a smaller portion
        - the tranches must sum to **exactly** listed_shares — a short sum leaves
        shares in nobody's hands, an over-sum conjures shares that were never issued

        ipo_price becomes the instrument's reference price until it first trades, so
        it has a valuation and something to quote against from the moment it lists.
        The allocation is one transaction: the audit rows and the share credits move
        together or not at all.
      operationId: runIPO
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/underwriter.IPORequest'
              description: Offering to run
              summary: body
        description: Offering to run
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/underwriter.IPOResponse'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Bad syndicate, shares do not sum, or unknown underwriter
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-API-Key
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Instrument code already exists
      security:
      - ApiKeyAuth: []
      summary: Run an IPO
      tags:
      - admin
  /api/admin/orders:
    get:
      description: |-
        Every order ever submitted, newest first, optionally filtered by emiten,
        participant, or status. This is the audit trail; the live book is served
        by the orderbook endpoints.
      operationId: listOrders
      parameters:
      - description: Filter by emiten code
        example: BBCA
        in: query
        name: emiten
        schema:
          type: string
      - description: Filter by broker code
        example: YP
        in: query
        name: participant
        schema:
          type: string
      - description: Filter by status
        in: query
        name: status
        schema:
          enum:
          - open
          - filled
          - cancelled
          type: string
      - description: Page number, from 1
        in: query
        name: page
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: Items per page, max 100
        in: query
        name: limit
        schema:
          default: 10
          maximum: 100
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.Page-order_OrderHistoryView'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unknown emiten/participant, or bad status
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-API-Key
      security:
      - ApiKeyAuth: []
      summary: List order history
      tags:
      - admin
  /api/admin/participants:
    get:
      description: |-
        Every exchange participant, ordered by code. API keys are **not** included
        and cannot be: only their hashes are stored. The prefix identifies which
        key is in place without exposing it.
      operationId: listParticipants
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/participant.ParticipantView'
                type: array
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-API-Key
      security:
      - ApiKeyAuth: []
      summary: List brokers
      tags:
      - admin
    post:
      description: |-
        Registers an exchange participant and issues its first API key.
        The key is returned **once, in this response only** — it is stored as a
        SHA-256 hash and cannot be retrieved again. A lost key is re-issued, not
        recovered.
      operationId: createParticipant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/participant.CreateRequest'
              description: Broker to create
              summary: body
        description: Broker to create
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/participant.IssuedKeyResponse'
          description: Created; contains the only copy of the key
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing kode or nama
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-API-Key
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Broker code already exists
      security:
      - ApiKeyAuth: []
      summary: Create a broker
      tags:
      - admin
  /api/admin/participants/apikey:
    delete:
      description: |-
        Removes the key. The next request carrying it is rejected immediately —
        authentication reads the database rather than a cache, so revocation is
        not delayed by an expiry.
      operationId: revokeParticipantKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/participant.KeyRequest'
              description: Target broker
              summary: body
        description: Target broker
        required: true
      responses:
        "204":
          description: Revoked
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unknown participant
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-API-Key
      security:
      - ApiKeyAuth: []
      summary: Revoke a broker's API key
      tags:
      - admin
    post:
      description: |-
        Mints a new key and invalidates the previous one immediately. The key is
        returned once and never again. The target broker travels in the body, not
        the path, so no identifier lands in access or proxy logs.
      operationId: issueParticipantKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/participant.KeyRequest'
              description: Target broker
              summary: body
        description: Target broker
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/participant.IssuedKeyResponse'
          description: The only copy of the new key
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unknown participant
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-API-Key
      security:
      - ApiKeyAuth: []
      summary: Re-issue a broker's API key
      tags:
      - admin
  /api/admin/trades:
    get:
      description: |-
        The raw execution log, newest first, optionally filtered by emiten or
        participant. Each row is one buy order matched against one sell order.
      operationId: listTrades
      parameters:
      - description: Filter by emiten code
        example: BBCA
        in: query
        name: emiten
        schema:
          type: string
      - description: Filter by broker code
        example: YP
        in: query
        name: participant
        schema:
          type: string
      - description: Page number, from 1
        in: query
        name: page
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: Items per page, max 100
        in: query
        name: limit
        schema:
          default: 10
          maximum: 100
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.Page-trade_TradeView'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-API-Key
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unknown emiten or participant filter
      security:
      - ApiKeyAuth: []
      summary: List executions
      tags:
      - admin
  /api/admin/transactions:
    get:
      description: |-
        Fills seen from a broker's own side. Omit `participant` to include every
        broker. A broker that matched its own resting order appears twice for
        that execution, once per side.
      operationId: adminTransactions
      parameters:
      - description: Broker code
        example: YP
        in: query
        name: participant
        required: true
        schema:
          type: string
      - description: Filter by emiten code
        example: BBCA
        in: query
        name: emiten
        schema:
          type: string
      - description: Page number, from 1
        in: query
        name: page
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: Items per page, max 100
        in: query
        name: limit
        schema:
          default: 10
          maximum: 100
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.Page-trade_TransactionView'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: participant is required
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-API-Key
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unknown participant or emiten
      security:
      - ApiKeyAuth: []
      summary: Transaction history for any broker
      tags:
      - admin
  /api/admin/underwriters:
    get:
      description: |-
        Every registered penjamin emisi, ordered by code.

        jenis is the role: **utama** is the lead underwriter that guarantees an
        offering, **pendukung** a supporting syndicate member taking a smaller
        tranche. participant is the broker the firm trades through — allocated
        shares land in that broker's holdings, because only a participant can
        trade them.
      operationId: listUnderwriters
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/underwriter.UnderwriterView'
                type: array
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-API-Key
      security:
      - ApiKeyAuth: []
      summary: List underwriters
      tags:
      - admin
    post:
      description: |-
        Registers a penjamin emisi against an existing broker. The broker is its
        trading identity: IPO allocations credit that participant's holdings, so an
        underwriter without one could be handed shares it could never sell.
      operationId: createUnderwriter
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/underwriter.CreateRequest'
              description: Underwriter to register
              summary: body
        description: Underwriter to register
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/underwriter.UnderwriterView'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing field, bad jenis, or unknown participant
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-API-Key
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Underwriter code already exists
      security:
      - ApiKeyAuth: []
      summary: Register an underwriter
      tags:
      - admin
  /api/admin/wallets:
    get:
      description: Every broker's cash balance, or one broker's when `participant`
        is given.
      operationId: listWallets
      parameters:
      - description: Filter by broker code
        example: YP
        in: query
        name: participant
        schema:
          type: string
      - description: Page number, from 1
        in: query
        name: page
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: Items per page, max 100
        in: query
        name: limit
        schema:
          default: 10
          maximum: 100
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.Page-wallet_WalletView'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-API-Key
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unknown participant
      security:
      - ApiKeyAuth: []
      summary: Cash balances across brokers
      tags:
      - admin
  /api/participant/assets:
    get:
      description: |-
        Every instrument the authenticated broker holds, with the current market
        value of each.

        The broker is taken from the API key and this endpoint accepts no
        `participant` parameter, so one broker cannot read another's positions.

        value is derived from the latest trade price rather than stored, so it is
        current even when this broker has not traded. It is null when the
        instrument has never traded.
      operationId: myAssets
      parameters:
      - description: Page number, from 1
        in: query
        name: page
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: Items per page, max 100
        in: query
        name: limit
        schema:
          default: 10
          maximum: 100
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.Page-assets_HoldingView'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-Participant-Key
      security:
      - ParticipantKeyAuth: []
      summary: Own share holdings
      tags:
      - participant
  /api/participant/emiten/{kode}:
    get:
      description: |-
        Master data plus all-time price statistics and derived valuations.

        current_price, highest_price, lowest_price and value are **null**, not 0,
        for an instrument that has never traded — no price exists yet, which is
        not the same as a price of zero.

        value is market capitalisation (current price × total shares), derived on
        read rather than stored, so it always reflects the latest trade.
        free_float_percentage is the publicly tradeable share of the total and
        always sums to 100 with unlisted_percentage.
      operationId: getEmitenDetail
      parameters:
      - description: Emiten code
        example: BBCA
        in: path
        name: kode
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/emiten.EmitenDetail'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-Participant-Key
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unknown emiten
      security:
      - ParticipantKeyAuth: []
      summary: Get instrument detail
      tags:
      - participant
  /api/participant/emiten/{kode}/candles:
    get:
      description: |-
        Executions aggregated into open/high/low/close bars with volume, newest
        bar first. Buckets are UTC-aligned. Open and close follow execution
        order, so two trades sharing a timestamp still resolve correctly.
      operationId: emitenCandles
      parameters:
      - description: Emiten code
        example: BBCA
        in: path
        name: kode
        required: true
        schema:
          type: string
      - description: Bucket width
        in: query
        name: interval
        schema:
          default: 1h
          enum:
          - 1m
          - 5m
          - 1h
          - 1d
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/trade.CandleView'
                type: array
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unsupported interval
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-Participant-Key
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unknown emiten
      security:
      - ParticipantKeyAuth: []
      summary: Price history (OHLC candles)
      tags:
      - participant
  /api/participant/emiten/{kode}/prices:
    get:
      description: |-
        Every execution for an instrument, newest first. Build candles from this
        client-side, or use the candles endpoint.
      operationId: emitenTicks
      parameters:
      - description: Emiten code
        example: BBCA
        in: path
        name: kode
        required: true
        schema:
          type: string
      - description: Page number, from 1
        in: query
        name: page
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: Items per page, max 100
        in: query
        name: limit
        schema:
          default: 10
          maximum: 100
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.Page-trade_TickView'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-Participant-Key
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unknown emiten
      security:
      - ParticipantKeyAuth: []
      summary: Price history (raw executions)
      tags:
      - participant
  /api/participant/index:
    get:
      description: |-
        The exchange-wide price level, computed IHSG-style: the summed
        free-float market capitalisation of every listed instrument, divided by
        a divisor and scaled to a base of 100.

        Each instrument is valued at its last traded price, falling back to its
        IPO price until it has traded — the same reference price the emiten
        detail endpoint reports. An instrument with neither is excluded rather
        than counted as zero, which is why **members** may be lower than
        **total**.

        Weighting is by listed (free-float) shares, not total shares outstanding,
        matching BEI's own methodology since 2021.

        **divisor** is restated whenever an instrument lists, so the level does
        not jump on an event where no price moved. It is returned so a client can
        verify the level rather than trust it.
      operationId: getIndex
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/index.IndexView'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-Participant-Key
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Index has not been computed yet
      security:
      - ParticipantKeyAuth: []
      summary: Read the composite index
      tags:
      - participant
  /api/participant/index/history:
    get:
      description: |-
        Past index levels, newest first. Each point carries the market
        capitalisation and divisor that produced it, so an old level stays
        verifiable even after the divisor has since been restated.

        Optional **from** and **to** bound the range, both RFC 3339 (for example
        `2026-07-30T00:00:00Z`). An unparseable value is rejected with 400 rather
        than silently ignored, since a filter that quietly does nothing returns a
        page the caller will misread as the whole range.
      operationId: getIndexHistory
      parameters:
      - description: Start of range, RFC 3339
        example: "2026-07-30T00:00:00Z"
        in: query
        name: from
        schema:
          type: string
      - description: End of range, RFC 3339
        example: "2026-07-31T00:00:00Z"
        in: query
        name: to
        schema:
          type: string
      - description: Page number, from 1
        in: query
        name: page
        schema:
          default: 1
          type: integer
      - description: Rows per page, max 100
        in: query
        name: limit
        schema:
          default: 10
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.Page-index_SnapshotView'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: from or to is not RFC 3339
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-Participant-Key
      security:
      - ParticipantKeyAuth: []
      summary: Read the composite index history
      tags:
      - participant
  /api/participant/orderbook:
    get:
      description: Returns a paginated list of the current order books, ordered by
        emiten code.
      operationId: getOrderBooks
      parameters:
      - description: Page number, from 1
        in: query
        name: page
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: Items per page, max 100
        in: query
        name: limit
        schema:
          default: 10
          maximum: 100
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.Page-orderbook_BookSnapshot'
          description: A page of order books
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-Participant-Key
      security:
      - ParticipantKeyAuth: []
      summary: List order books
      tags:
      - participant
  /api/participant/orderbook/{kode}:
    get:
      description: |-
        Returns the book aggregated by price level. Bids are highest price
        first; asks are lowest price first.
      operationId: getOrderBook
      parameters:
      - description: Emiten code
        example: BBCA
        in: path
        name: kode
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/orderbook.BookSnapshot'
          description: Current book state
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-Participant-Key
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unknown emiten
      security:
      - ParticipantKeyAuth: []
      summary: Get one order book
      tags:
      - participant
  /api/participant/orders:
    post:
      description: |-
        Runs the order through continuous matching and returns the trades it
        produced. A limit order with leftover quantity rests in the book (open);
        a market order with leftover quantity is cancelled and never booked.
        The order, its trades and the fills against the resting orders it
        consumed are persisted in a single transaction.

        A sell is rejected if the broker does not hold enough shares once its
        resting sell orders are counted, so a position can never go negative.
      operationId: submitOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/order.SubmitOrderRequest'
              description: Order to submit
              summary: body
        description: Order to submit
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/order.SubmitOrderResponse'
          description: 'Order processed: the resulting order state and any trades'
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unknown emiten/participant, bad side/type, qty <= 0, price
            <= 0 for a limit order, insufficient shares, or an inactive emiten
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-Participant-Key
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Persistence failure
      security:
      - ParticipantKeyAuth: []
      summary: Submit a new order
      tags:
      - participant
  /api/participant/transactions:
    get:
      description: |-
        Every fill for the authenticated broker, newest first, seen from its own
        side — so `side` and `counterparty` are relative to the caller.

        The broker is taken from the API key. This endpoint accepts no
        `participant` parameter, so one broker cannot read another's fills.
      operationId: myTransactions
      parameters:
      - description: Filter by emiten code
        example: BBCA
        in: query
        name: emiten
        schema:
          type: string
      - description: Page number, from 1
        in: query
        name: page
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: Items per page, max 100
        in: query
        name: limit
        schema:
          default: 10
          maximum: 100
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.Page-trade_TransactionView'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-Participant-Key
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unknown emiten filter
      security:
      - ParticipantKeyAuth: []
      summary: Own transaction history
      tags:
      - participant
  /api/participant/wallet:
    get:
      description: |-
        The authenticated broker's current cash balance.

        The broker is taken from the API key and this endpoint accepts no
        `participant` parameter, so one broker cannot read another's balance.
      operationId: myWallet
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wallet.WalletView'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-Participant-Key
      security:
      - ParticipantKeyAuth: []
      summary: Own cash balance
      tags:
      - participant
  /ws/admin/orderbook/{kode}:
    get:
      description: |-
        Upgrades to a WebSocket connection. On connect the server sends a full
        snapshot — the same shape as GET /api/participant/orderbook/{kode}, tagged
        with type "update" — then a fresh full snapshot every time this emiten's
        book changes. The stream is outbound-only; orders are never accepted over it.

        The identical stream is available to admin at /ws/admin/orderbook/{kode};
        only the credential differs.

        Not exercisable from Swagger UI, because it is not plain HTTP and browsers
        cannot set headers on a WS handshake. Connect with a WebSocket client at
        ws://localhost:8080/ws/participant/orderbook/BBCA.
        The same outbound-only book stream as the participant route, reached with
        the static admin key instead of a broker key. One controller serves both,
        so the payload is identical.
      operationId: streamOrderBookAdmin
      parameters:
      - description: Emiten code
        example: BBCA
        in: path
        name: kode
        required: true
        schema:
          type: string
      - description: Emiten code
        example: BBCA
        in: path
        name: kode
        required: true
        schema:
          type: string
      responses:
        "101":
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/orderbook.BookSnapshot'
                - $ref: '#/components/schemas/orderbook.BookSnapshot'
          description: Switching Protocols; thereafter each message is a book snapshot
        "401":
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/httpx.ErrorResponse'
                - $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-API-Key
        "404":
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/httpx.ErrorResponse'
                - $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unknown emiten
      security:
      - ParticipantKeyAuth: []
      - ApiKeyAuth: []
      summary: Stream order book updates (WebSocket, admin)
      tags:
      - participant
      - admin
  /ws/participant/orderbook/{kode}:
    get:
      description: |-
        Upgrades to a WebSocket connection. On connect the server sends a full
        snapshot — the same shape as GET /api/participant/orderbook/{kode}, tagged
        with type "update" — then a fresh full snapshot every time this emiten's
        book changes. The stream is outbound-only; orders are never accepted over it.

        The identical stream is available to admin at /ws/admin/orderbook/{kode};
        only the credential differs.

        Not exercisable from Swagger UI, because it is not plain HTTP and browsers
        cannot set headers on a WS handshake. Connect with a WebSocket client at
        ws://localhost:8080/ws/participant/orderbook/BBCA.
        The same outbound-only book stream as the participant route, reached with
        the static admin key instead of a broker key. One controller serves both,
        so the payload is identical.
      operationId: streamOrderBookAdmin
      parameters:
      - description: Emiten code
        example: BBCA
        in: path
        name: kode
        required: true
        schema:
          type: string
      - description: Emiten code
        example: BBCA
        in: path
        name: kode
        required: true
        schema:
          type: string
      responses:
        "101":
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/orderbook.BookSnapshot'
                - $ref: '#/components/schemas/orderbook.BookSnapshot'
          description: Switching Protocols; thereafter each message is a book snapshot
        "401":
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/httpx.ErrorResponse'
                - $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Missing or wrong X-API-Key
        "404":
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/httpx.ErrorResponse'
                - $ref: '#/components/schemas/httpx.ErrorResponse'
          description: Unknown emiten
      security:
